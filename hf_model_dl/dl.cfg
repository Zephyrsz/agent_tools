repo_id = "InternScience/Agents-A1"
revision = "main"
output_dir = "~/pj_local_llm/hf-models"

# Preferred: keep the token outside the config file.
token_env = "HF_TOKEN"

# Optional fallback. If token_env resolves to a value, token_env wins.
# token = "hf_xxx"

connections = 8
split_size = "1M"

# If this list is non-empty, matching files are downloaded directly.
# If omitted or empty, the CLI enters interactive selection.
include_patterns = ["*Q4_K_M*.gguf"]

# Applied after include matching or interactive selection.
exclude_patterns = []
